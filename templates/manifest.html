<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Document Manifest — MTI .claude/</title>
<style>
:root{--bg:#1e1e2e;--sf:#27273a;--bd:#3a3a55;--tx:#cdd6f4;--mu:#7f849c;
  --ac:#89b4fa;--gn:#a6e3a1;--am:#f9e2af;--rd:#f38ba8;--pu:#cba6f7;
  --cy:#89dceb;--cb:#181825;--de:#313244;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:13px;line-height:1.6;background:var(--bg);color:var(--tx);
  padding:32px;max-width:1100px;margin:0 auto}
.bar{position:sticky;top:0;z-index:100;background:var(--cb);
  border-bottom:1px solid var(--bd);padding:8px 16px;
  display:flex;align-items:center;gap:12px;margin:-32px -32px 28px;
  font-size:12px;color:var(--mu)}
.bar strong{color:var(--ac);font-size:13px}
h1{font-size:20px;font-weight:700;color:var(--ac);margin-bottom:4px}
h2{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mu);margin:28px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--bd)}
.meta{font-size:12px;color:var(--mu);margin-bottom:20px}
/* Tables */
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
thead tr{border-bottom:2px solid var(--bd)}
th{background:var(--de);color:var(--mu);font-size:10px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;padding:7px 10px;
  text-align:left;white-space:nowrap;user-select:none}
th[data-col]{cursor:pointer}
th[data-col]:hover{color:var(--ac)}
th.sort-asc::after{content:" ↑"}
th.sort-desc::after{content:" ↓"}
td{padding:7px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:hover td{background:rgba(137,180,250,.04)}
td.dt{font-family:"SF Mono","Fira Code",Consolas,monospace;font-size:11px;
  color:var(--mu);white-space:nowrap}
td.name a{color:var(--ac);text-decoration:none;font-weight:500}
td.name a:hover{text-decoration:underline}
td.desc{color:var(--mu);font-size:11px}
/* Annotation badge */
.ann-badge{display:inline-block;min-width:22px;text-align:center;
  font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;
  font-family:"SF Mono","Fira Code",Consolas,monospace;cursor:default}
.ann-0{background:rgba(127,132,156,.12);color:var(--mu);border:1px solid rgba(127,132,156,.2)}
.ann-lo{background:rgba(137,180,250,.15);color:var(--ac);border:1px solid rgba(137,180,250,.3);cursor:help}
.ann-hi{background:rgba(203,166,247,.15);color:var(--pu);border:1px solid rgba(203,166,247,.3);cursor:help}
/* Annotation popover */
#ann-pop{position:fixed;display:none;z-index:200;max-width:380px;
  background:var(--cb);border:1px solid var(--pu);border-radius:6px;
  padding:10px 12px;font-size:11px;line-height:1.5;pointer-events:none;
  box-shadow:0 4px 20px rgba(0,0,0,.5)}
#ann-pop .pop-key{color:var(--pu);font-family:monospace;font-size:10px;margin-right:6px}
#ann-pop .pop-val{color:var(--tx)}
#ann-pop .pop-row{margin-bottom:5px;border-bottom:1px solid var(--bd);padding-bottom:5px}
#ann-pop .pop-row:last-child{margin-bottom:0;border-bottom:none;padding-bottom:0}
/* Spec table links */
td.spec-name a{color:var(--cy);text-decoration:none;font-weight:500;font-family:monospace;font-size:11px}
td.spec-name a:hover{color:var(--ac);text-decoration:underline}
/* Refresh button */
.refresh-btn{background:none;border:1px solid var(--bd);color:var(--mu);
  font-size:11px;padding:2px 10px;border-radius:4px;cursor:pointer;font-family:inherit}
.refresh-btn:hover{border-color:var(--ac);color:var(--ac)}
#status{font-size:11px;color:var(--mu);margin-left:6px}
</style>
</head>
<body>

<div class="bar">
  <strong>Manifest</strong>
  <span style="color:var(--mu);font-size:11px">MTI .claude/</span>
  <span style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <button class="refresh-btn" id="refresh-btn">↻ Refresh</button>
    <span id="status"></span>
  </span>
</div>

<div id="ann-pop"></div>

<h1 id="page-title">Document Manifest</h1>
<div class="meta" id="doc-summary">Loading…</div>

<h2>Development Documents</h2>
<table>
  <thead>
    <tr>
      <th data-col="datetime" class="sort-desc" style="width:155px">Date/Time</th>
      <th data-col="name">Name</th>
      <th data-col="annotation_count" style="width:100px;text-align:center">Annotations</th>
      <th data-col="title">Description</th>
    </tr>
  </thead>
  <tbody id="doc-tbody"></tbody>
</table>

<h2>Project Specifications</h2>
<div class="meta" id="spec-summary"></div>
<table>
  <thead>
    <tr>
      <th data-col="mtime" style="width:155px">Modified</th>
      <th data-col="filename" style="width:240px">File</th>
      <th data-col="description">Description</th>
    </tr>
  </thead>
  <tbody id="spec-tbody"></tbody>
</table>

<script>
// ── Utilities ────────────────────────────────────────────────────────────
function fmtDatetime(dt) {
  const [date, time] = dt.split(' ');
  const [h, m] = time.split(':');
  const hour = parseInt(h, 10);
  const ampm = hour >= 12 ? 'pm' : 'am';
  const h12 = hour % 12 || 12;
  return `${date} ${h12}:${m}${ampm}`;
}

function cleanName(filename) {
  return filename.replace(/\.html$/, '').replace(/-\d{4}-\d{2}-\d{2}(-\d{6})?$/, '') || filename;
}

function annBadge(n) {
  const cls = n === 0 ? 'ann-0' : n < 10 ? 'ann-lo' : 'ann-hi';
  return `<span class="ann-badge ${cls}" title="${n} annotation${n!==1?'s':''}">${n}</span>`;
}

// ── Annotation popover ───────────────────────────────────────────────────
const pop = document.getElementById('ann-pop');
const annCache = new Map();
let hideTimer = null;

function showPop(stem, badge) {
  clearTimeout(hideTimer);
  async function render(data) {
    const entries = Object.entries(data).filter(([,v]) => v && v.trim());
    if (!entries.length) return;
    pop.innerHTML = entries.map(([k, v]) =>
      `<div class="pop-row"><span class="pop-key">${k}</span><span class="pop-val">${v.trim().slice(0,120)}${v.length>120?'…':''}</span></div>`
    ).join('');
    const r = badge.getBoundingClientRect();
    pop.style.left = Math.min(r.left, window.innerWidth - 400) + 'px';
    pop.style.top  = (r.bottom + 6) + 'px';
    pop.style.display = 'block';
  }
  if (annCache.has(stem)) {
    render(annCache.get(stem));
  } else {
    fetch(`/annotations/${stem}`)
      .then(r => r.json())
      .then(data => { annCache.set(stem, data); render(data); })
      .catch(() => {});
  }
}

function hidePop() {
  hideTimer = setTimeout(() => { pop.style.display = 'none'; }, 120);
}

// ── Document table ───────────────────────────────────────────────────────
let docSortCol = 'datetime', docSortDir = -1;

function renderDocRow(doc) {
  const name = cleanName(doc.filename);
  const stem = doc.filename.replace(/\.html$/, '');
  const tr = document.createElement('tr');
  tr.dataset.datetime = doc.datetime;
  tr.dataset.name = name.toLowerCase();
  tr.dataset.annotation_count = doc.annotation_count;
  tr.dataset.title = doc.title.toLowerCase();
  tr.innerHTML =
    `<td class="dt">${fmtDatetime(doc.datetime)}</td>` +
    `<td class="name"><a href="/${doc.filename}">${name}</a></td>` +
    `<td style="text-align:center">${annBadge(doc.annotation_count)}</td>` +
    `<td class="desc">${doc.title}</td>`;

  if (doc.annotation_count > 0) {
    const badge = tr.querySelector('.ann-badge');
    badge.addEventListener('mouseenter', () => showPop(stem, badge));
    badge.addEventListener('mouseleave', hidePop);
  }
  return tr;
}

function sortDocTable() {
  const tbody = document.getElementById('doc-tbody');
  const rows = [...tbody.querySelectorAll('tr')];
  rows.sort((a, b) => {
    const av = a.dataset[docSortCol] || '', bv = b.dataset[docSortCol] || '';
    const an = parseFloat(av), bn = parseFloat(bv);
    if (!isNaN(an) && !isNaN(bn)) return (an - bn) * docSortDir;
    return av.localeCompare(bv) * docSortDir;
  });
  rows.forEach(r => tbody.appendChild(r));
  document.querySelectorAll('#doc-tbody').length; // noop
  document.querySelectorAll('thead th[data-col]').forEach(th => {
    // only reset headers in the doc table (first thead)
  });
  updateDocSortIndicators();
}

function updateDocSortIndicators() {
  const docTable = document.getElementById('doc-tbody').closest('table');
  docTable.querySelectorAll('th[data-col]').forEach(th => {
    th.classList.remove('sort-asc', 'sort-desc');
    if (th.dataset.col === docSortCol)
      th.classList.add(docSortDir > 0 ? 'sort-asc' : 'sort-desc');
  });
}

document.getElementById('doc-tbody').closest('table').querySelectorAll('th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    if (th.dataset.col === docSortCol) docSortDir *= -1;
    else { docSortCol = th.dataset.col; docSortDir = 1; }
    sortDocTable();
  });
});

// ── Spec table ──────────────────────────────────────────────────────────
let specSortCol = 'mtime', specSortDir = -1;

function renderSpecRow(spec) {
  const tr = document.createElement('tr');
  tr.dataset.mtime = spec.mtime;
  tr.dataset.filename = spec.filename.toLowerCase();
  tr.dataset.description = spec.description.toLowerCase();
  tr.innerHTML =
    `<td class="dt">${fmtDatetime(spec.mtime)}</td>` +
    `<td class="spec-name"><a href="/spec/${spec.filename}" target="_blank">${spec.filename}</a></td>` +
    `<td class="desc">${spec.description}</td>`;
  return tr;
}

function sortSpecTable() {
  const tbody = document.getElementById('spec-tbody');
  const rows = [...tbody.querySelectorAll('tr')];
  rows.sort((a, b) => {
    const av = a.dataset[specSortCol] || '', bv = b.dataset[specSortCol] || '';
    return av.localeCompare(bv) * specSortDir;
  });
  rows.forEach(r => tbody.appendChild(r));
  document.getElementById('spec-tbody').closest('table').querySelectorAll('th[data-col]').forEach(th => {
    th.classList.remove('sort-asc', 'sort-desc');
    if (th.dataset.col === specSortCol)
      th.classList.add(specSortDir > 0 ? 'sort-asc' : 'sort-desc');
  });
}

document.getElementById('spec-tbody').closest('table').querySelectorAll('th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    if (th.dataset.col === specSortCol) specSortDir *= -1;
    else { specSortCol = th.dataset.col; specSortDir = 1; }
    sortSpecTable();
  });
});

// ── Load ────────────────────────────────────────────────────────────────
async function load() {
  const status = document.getElementById('status');
  const btn = document.getElementById('refresh-btn');
  btn.textContent = '↻'; status.textContent = 'Fetching…';

  const [docsRes, specsRes, metaRes] = await Promise.all([
    fetch('/docs').then(r => r.json()).catch(() => []),
    fetch('/spec/').then(r => r.json()).catch(() => []),
    fetch('/meta').then(r => r.json()).catch(() => ({})),
  ]);

  if (metaRes.project) {
    const title = document.getElementById('page-title');
    title.textContent = `${metaRes.project} — Document Manifest`;
    document.title = `${metaRes.project} — Document Manifest`;
  }

  // Docs
  const tbody = document.getElementById('doc-tbody');
  tbody.innerHTML = '';
  docsRes.forEach(d => tbody.appendChild(renderDocRow(d)));
  docSortCol = 'datetime'; docSortDir = -1;
  sortDocTable();
  const totalAnn = docsRes.reduce((s, d) => s + d.annotation_count, 0);
  document.getElementById('doc-summary').textContent =
    `${docsRes.length} document${docsRes.length !== 1 ? 's' : ''} · ${totalAnn} annotation${totalAnn !== 1 ? 's' : ''}`;

  // Specs
  const stbody = document.getElementById('spec-tbody');
  stbody.innerHTML = '';
  specsRes.forEach(s => stbody.appendChild(renderSpecRow(s)));
  specSortCol = 'filename'; specSortDir = 1;
  sortSpecTable();
  document.getElementById('spec-summary').textContent =
    `${specsRes.length} specification file${specsRes.length !== 1 ? 's' : ''}`;

  status.textContent = `Updated ${new Date().toLocaleTimeString()}`;
  btn.textContent = '↻ Refresh';
}

document.getElementById('refresh-btn').addEventListener('click', load);
load();
</script>
</body>
</html>
