<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Document Manifest — MTI .claude/</title>
<style>
:root{--bg:#1e1e2e;--sf:#27273a;--bd:#3a3a55;--tx:#cdd6f4;--mu:#7f849c;
  --ac:#89b4fa;--gn:#a6e3a1;--am:#f9e2af;--rd:#f38ba8;--pu:#cba6f7;
  --cy:#89dceb;--cb:#181825;--de:#313244;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:13px;line-height:1.6;background:var(--bg);color:var(--tx);
  padding:32px;max-width:1100px;margin:0 auto}
.bar{position:sticky;top:0;z-index:100;background:var(--cb);
  border-bottom:1px solid var(--bd);padding:8px 16px;
  display:flex;align-items:center;gap:12px;margin:-32px -32px 28px;
  font-size:12px;color:var(--mu)}
.bar strong{color:var(--ac);font-size:13px}
h1{font-size:20px;font-weight:700;color:var(--ac);margin-bottom:4px}
.meta{font-size:12px;color:var(--mu);margin-bottom:20px}
/* Table */
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}
thead tr{border-bottom:2px solid var(--bd)}
th{background:var(--de);color:var(--mu);font-size:10px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;padding:8px 10px;
  text-align:left;white-space:nowrap;user-select:none}
th[data-col]{cursor:pointer}
th[data-col]:hover{color:var(--ac)}
th.sort-asc::after{content:" ↑"}
th.sort-desc::after{content:" ↓"}
td{padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:hover td{background:rgba(137,180,250,.04)}
td.dt{font-family:"SF Mono","Fira Code",Consolas,monospace;font-size:11px;
  color:var(--mu);white-space:nowrap}
td.name a{color:var(--tx);text-decoration:none;font-weight:500}
td.name a:hover{color:var(--ac);text-decoration:underline}
td.desc{color:var(--mu);font-size:11px;max-width:420px}
/* Annotation badge */
.ann-badge{display:inline-block;min-width:22px;text-align:center;
  font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;
  font-family:"SF Mono","Fira Code",Consolas,monospace}
.ann-0{background:rgba(127,132,156,.12);color:var(--mu);border:1px solid rgba(127,132,156,.2)}
.ann-lo{background:rgba(137,180,250,.15);color:var(--ac);border:1px solid rgba(137,180,250,.3)}
.ann-hi{background:rgba(203,166,247,.15);color:var(--pu);border:1px solid rgba(203,166,247,.3)}
/* Refresh btn */
.refresh-btn{background:none;border:1px solid var(--bd);color:var(--mu);
  font-size:11px;padding:2px 10px;border-radius:4px;cursor:pointer;font-family:inherit}
.refresh-btn:hover{border-color:var(--ac);color:var(--ac)}
.refresh-btn.spinning{animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
#status{font-size:11px;color:var(--mu);margin-left:8px}
</style>
</head>
<body>

<div class="bar">
  <strong>Manifest</strong>
  <span style="color:var(--mu);font-size:11px">.claude/ · MTI</span>
  <span style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <button class="refresh-btn" id="refresh-btn">↻ Refresh</button>
    <span id="status"></span>
  </span>
</div>

<h1>Document Manifest</h1>
<div class="meta" id="summary">Loading…</div>

<table>
  <thead>
    <tr>
      <th data-col="datetime" class="sort-desc">Date/Time</th>
      <th data-col="name">Name</th>
      <th data-col="annotation_count" style="width:110px;text-align:center">Annotations</th>
      <th data-col="title">Description</th>
    </tr>
  </thead>
  <tbody id="doc-tbody"></tbody>
</table>

<script>
const API = '/docs';
let docs = [], sortCol = 'datetime', sortDir = -1;

function cleanName(filename) {
  return filename
    .replace(/\.html$/, '')
    .replace(/-\d{4}-\d{2}-\d{2}(-\d{6})?$/, '') || filename;
}

function fmtDatetime(dt) {
  // dt: 'YYYY-MM-DD HH:MM:SS'  →  'MM-DD-YY HH:MM:SS'
  const [date, time] = dt.split(' ');
  const [y, mo, d] = date.split('-');
  return `${mo}-${d}-${y.slice(2)} ${time || '00:00:00'}`;
}

function annBadge(n) {
  const cls = n === 0 ? 'ann-0' : n < 10 ? 'ann-lo' : 'ann-hi';
  return `<span class="ann-badge ${cls}">${n}</span>`;
}

function renderRow(doc) {
  const name = cleanName(doc.filename);
  const tr = document.createElement('tr');
  tr.dataset.datetime = doc.datetime;
  tr.dataset.name = name.toLowerCase();
  tr.dataset.annotation_count = doc.annotation_count;
  tr.dataset.title = doc.title.toLowerCase();
  tr.innerHTML =
    `<td class="dt">${fmtDatetime(doc.datetime)}</td>` +
    `<td class="name"><a href="/${doc.filename}">${name}</a></td>` +
    `<td style="text-align:center">${annBadge(doc.annotation_count)}</td>` +
    `<td class="desc">${doc.title}</td>`;
  return tr;
}

function sortRows() {
  const tbody = document.getElementById('doc-tbody');
  const rows = [...tbody.querySelectorAll('tr')];
  rows.sort((a, b) => {
    const av = a.dataset[sortCol] || '', bv = b.dataset[sortCol] || '';
    const an = parseFloat(av), bn = parseFloat(bv);
    if (!isNaN(an) && !isNaN(bn)) return (an - bn) * sortDir;
    return av.localeCompare(bv) * sortDir;
  });
  rows.forEach(r => tbody.appendChild(r));
  document.querySelectorAll('th[data-col]').forEach(th => {
    th.classList.remove('sort-asc', 'sort-desc');
    if (th.dataset.col === sortCol)
      th.classList.add(sortDir > 0 ? 'sort-asc' : 'sort-desc');
  });
}

async function load() {
  const status = document.getElementById('status');
  const btn = document.getElementById('refresh-btn');
  btn.textContent = '↻';
  btn.classList.add('spinning');
  status.textContent = 'Fetching…';
  try {
    const r = await fetch(API);
    docs = await r.json();
    const tbody = document.getElementById('doc-tbody');
    tbody.innerHTML = '';
    docs.forEach(d => tbody.appendChild(renderRow(d)));
    sortRows();
    const totalAnn = docs.reduce((s, d) => s + d.annotation_count, 0);
    document.getElementById('summary').textContent =
      `${docs.length} document${docs.length !== 1 ? 's' : ''} · ${totalAnn} annotation${totalAnn !== 1 ? 's' : ''} · last refreshed ${new Date().toLocaleTimeString()}`;
    status.textContent = '';
  } catch (e) {
    status.textContent = 'Error loading /docs';
  }
  btn.classList.remove('spinning');
  btn.textContent = '↻ Refresh';
}

document.querySelectorAll('th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    if (th.dataset.col === sortCol) sortDir *= -1;
    else { sortCol = th.dataset.col; sortDir = 1; }
    sortRows();
  });
});

document.getElementById('refresh-btn').addEventListener('click', load);
load();
</script>
</body>
</html>
